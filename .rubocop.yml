AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "lib/fineract/generated/**/*.rb"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/RedundantReturn:
  Exclude:
    - "lib/fineract/api/client/create_address.rb"

# The project prioritizes API-contract clarity; generated endpoint wrappers make these
# generic style checks noisy without improving runtime safety.
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Naming/VariableNumber:
  Enabled: false
